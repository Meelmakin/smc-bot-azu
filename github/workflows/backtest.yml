name: backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest test_bias -v
      - name: Backtest
        run: python bias_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-backtest
          path: bias_backtest_trades.csv
