name: bias-backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest test_bias -v
      - name: Backtest slk style, daily levels and 4H structure
        shell: bash
        run: python bias_backtest.py --tf D1H4 --style slk --out bias_trades_slk.csv 2> warnings.log | tee report_slk.txt
      - name: Backtest legacy style, same data, for comparison
        shell: bash
        run: python bias_backtest.py --tf D1H4 --style legacy --out bias_trades_legacy.csv 2>> warnings.log | tee report_legacy.txt
      - name: Backtest slk style, 4H levels and 1H structure
        shell: bash
        run: python bias_backtest.py --tf H4H1 --style slk --out bias_trades_slk_1h.csv 2>> warnings.log | tee report_slk_1h.txt
      - name: Show results on the run page
        if: always()
        run: |
          echo "## slk style: daily levels + 4H structure" >> $GITHUB_STEP_SUMMARY
          sed 's/^/    /' report_slk.txt >> $GITHUB_STEP_SUMMARY || true
          echo "## legacy style: daily levels + 4H structure" >> $GITHUB_STEP_SUMMARY
          sed 's/^/    /' report_legacy.txt >> $GITHUB_STEP_SUMMARY || true
          echo "## slk style: 4H levels + 1H structure" >> $GITHUB_STEP_SUMMARY
          sed 's/^/    /' report_slk_1h.txt >> $GITHUB_STEP_SUMMARY || true
          grep -v -e Pandas4Warning -e 'See https' -e 'inplace=True' warnings.log | tail -n 15 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-backtest
          path: |
            bias_trades_slk.csv
            bias_trades_legacy.csv
            bias_trades_slk_1h.csv
            report_slk.txt
            report_legacy.txt
            report_slk_1h.txt
