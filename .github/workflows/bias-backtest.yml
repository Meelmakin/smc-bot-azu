      - name: Backtest
        shell: bash
        run: python bias_backtest.py 2> warnings.log | tee report.txt
      - name: Show results on the run page
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v -e Pandas4Warning -e 'See https' -e 'inplace=True' warnings.log | tail -n 15 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-backtest
          path: |
            bias_backtest_trades.csv
            report.txt
